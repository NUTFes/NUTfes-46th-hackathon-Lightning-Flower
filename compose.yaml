services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      # ホストの node_modules・.next を使わず、コンテナの中のものを使う
      - node_modules:/app/node_modules
      - next:/app/.next
      - pnpm-store:/pnpm-store
    env_file:
      - path: .env.local
        required: false
    environment:
      # コンテナの外（ブラウザ）からつなげるように
      HOSTNAME: 0.0.0.0
    extra_hosts:
      # Linux でも host.docker.internal でホストに届くように
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
  next:
  pnpm-store:
