services:
  app:
    build: .
    ports:
      # 自分の PC からだけ開けるようにする。ローカルでは DEV_STAFF_EMAIL で誰でも
      # member / admin になれるので、同じネットワークの人から開けてはいけない
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      # ホストの node_modules・.next を使わず、コンテナの中のものを使う
      - node_modules:/app/node_modules
      - next:/app/.next
      - pnpm-store:/pnpm-store
    env_file:
      - path: .env.local
        required: false
    extra_hosts:
      # Linux でも host.docker.internal でホストに届くように
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
  next:
  pnpm-store:
