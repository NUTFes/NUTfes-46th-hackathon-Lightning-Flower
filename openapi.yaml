openapi: 3.1.0
info:
  title: オトシル API
  version: 0.1.0
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    HealthOk:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        db:
          type: string
          enum:
            - ok
      required:
        - status
        - db
    HealthError:
      type: object
      properties:
        status:
          type: string
          enum:
            - error
        db:
          type: string
          enum:
            - unreachable
      required:
        - status
        - db
    CategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - items
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        isValuableDefault:
          type: boolean
      required:
        - id
        - name
        - isValuableDefault
    Me:
      oneOf:
        - type: object
          properties:
            role:
              type: string
              enum:
                - admin
                - member
            email:
              type: string
          required:
            - role
            - email
        - type: object
          properties:
            role:
              type: string
              enum:
                - guest
            email:
              type: string
            consented:
              type: boolean
          required:
            - role
            - email
            - consented
  parameters: {}
paths:
  /api/health:
    get:
      summary: アプリと DB の疎通確認
      responses:
        "200":
          description: アプリと DB がつながっている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOk"
        "503":
          description: DB につながらない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
  /api/categories:
    get:
      summary: カテゴリ 12 種と貴重品の初期値
      responses:
        "200":
          description: カテゴリの一覧（並び順どおり）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - VALIDATION_ERROR
                          - UNAUTHORIZED
                          - FORBIDDEN
                          - NOT_FOUND
                          - CONFLICT
                          - INTERNAL_ERROR
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
  /api/me:
    get:
      summary: ログイン中の人のロール・メール・同意済みか
      responses:
        "200":
          description: ログイン中の人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: ログインしていない
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - VALIDATION_ERROR
                          - UNAUTHORIZED
                          - FORBIDDEN
                          - NOT_FOUND
                          - CONFLICT
                          - INTERNAL_ERROR
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - VALIDATION_ERROR
                          - UNAUTHORIZED
                          - FORBIDDEN
                          - NOT_FOUND
                          - CONFLICT
                          - INTERNAL_ERROR
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
webhooks: {}
