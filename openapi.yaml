openapi: 3.1.0
info:
  title: オトシル API
  version: 0.1.0
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    FoundItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayNumber:
          type: string
          example: 拾-00042
        status:
          $ref: "#/components/schemas/FoundStatus"
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          required:
            - id
            - name
        color:
          $ref: "#/components/schemas/ItemColor"
        brand:
          type:
            - string
            - "null"
        foundPlace:
          type: string
        foundAt:
          type: string
          format: date-time
        isValuable:
          type: boolean
        memo:
          type:
            - string
            - "null"
        photos:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              url:
                type: string
              thumbUrl:
                type: string
            required:
              - id
              - url
              - thumbUrl
        registeredByEmail:
          type: string
        canEdit:
          type: boolean
        activeMatch:
          type:
            - object
            - "null"
          properties:
            lostReportId:
              type: string
              format: uuid
            displayNumber:
              type: string
          required:
            - lostReportId
            - displayNumber
        handover:
          type:
            - object
            - "null"
          properties:
            handedAt:
              type: string
              format: date-time
            receiverName:
              type:
                - string
                - "null"
          required:
            - handedAt
            - receiverName
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayNumber
        - status
        - category
        - color
        - brand
        - foundPlace
        - foundAt
        - isValuable
        - memo
        - photos
        - registeredByEmail
        - canEdit
        - activeMatch
        - handover
        - createdAt
    FoundStatus:
      type: string
      enum:
        - received
        - matching
        - awaiting_handover
        - resolved
        - transferred_to_police
        - disposed
    ItemColor:
      type: string
      enum:
        - black
        - white
        - gray
        - brown
        - beige
        - red
        - pink
        - orange
        - yellow
        - green
        - blue
        - navy
        - purple
        - gold
        - silver
        - clear
        - other
    FoundItemCreateBody:
      type: object
      properties:
        categoryId:
          type: integer
          minimum: 1
          maximum: 32767
        color:
          $ref: "#/components/schemas/ItemColor"
        brand:
          type:
            - string
            - "null"
          minLength: 1
        foundPlace:
          type: string
          minLength: 1
        foundAt:
          type: string
          format: date-time
        isValuable:
          type: boolean
        memo:
          type:
            - string
            - "null"
          minLength: 1
        photos:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                minLength: 1
              thumbPath:
                type: string
                minLength: 1
            required:
              - path
              - thumbPath
          maxItems: 10
      required:
        - categoryId
        - color
        - foundPlace
        - photos
    LostReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayNumber:
          type: string
          example: 申-00118
        status:
          $ref: "#/components/schemas/LostStatus"
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          required:
            - id
            - name
        color:
          $ref: "#/components/schemas/ItemColor"
        brand:
          type:
            - string
            - "null"
        lostPlace:
          type: string
        lostAt:
          type: string
          format: date-time
        note:
          type:
            - string
            - "null"
        verified:
          type: boolean
        pickup:
          type:
            - object
            - "null"
          properties:
            method:
              $ref: "#/components/schemas/PickupMethod"
            note:
              type:
                - string
                - "null"
          required:
            - method
            - note
        cancel:
          type:
            - object
            - "null"
          properties:
            reason:
              $ref: "#/components/schemas/CancelReason"
            note:
              type:
                - string
                - "null"
            cancelledAt:
              type: string
              format: date-time
          required:
            - reason
            - note
            - cancelledAt
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayNumber
        - status
        - category
        - color
        - brand
        - lostPlace
        - lostAt
        - note
        - verified
        - pickup
        - cancel
        - createdAt
    LostStatus:
      type: string
      enum:
        - searching
        - maybe_found
        - awaiting_handover
        - resolved
        - transferred_to_police
        - disposed
        - cancelled
    PickupMethod:
      type: string
      enum:
        - today
        - later
        - other
    CancelReason:
      type: string
      enum:
        - found_myself
        - no_longer_needed
        - other
    LostReportForAdmin:
      allOf:
        - $ref: "#/components/schemas/LostReport"
        - type: object
          properties:
            guest:
              type: object
              properties:
                email:
                  type: string
                displayName:
                  type:
                    - string
                    - "null"
              required:
                - email
                - displayName
            activeMatch:
              type:
                - object
                - "null"
              properties:
                foundItemId:
                  type: string
                  format: uuid
                displayNumber:
                  type: string
              required:
                - foundItemId
                - displayNumber
            awaitingReply:
              type: boolean
          required:
            - guest
            - activeMatch
            - awaitingReply
    LostReportList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LostReport"
        total:
          type: integer
      required:
        - items
        - total
    LostReportForAdminList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LostReportForAdmin"
        total:
          type: integer
      required:
        - items
        - total
    HealthOk:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        db:
          type: string
          enum:
            - ok
      required:
        - status
        - db
    HealthError:
      type: object
      properties:
        status:
          type: string
          enum:
            - error
        db:
          type: string
          enum:
            - unreachable
      required:
        - status
        - db
    CategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - items
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        isValuableDefault:
          type: boolean
      required:
        - id
        - name
        - isValuableDefault
    Me:
      oneOf:
        - type: object
          properties:
            role:
              type: string
              enum:
                - admin
                - member
            email:
              type: string
          required:
            - role
            - email
        - type: object
          properties:
            role:
              type: string
              enum:
                - guest
            email:
              type: string
            consented:
              type: boolean
          required:
            - role
            - email
            - consented
    FoundItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FoundItem"
        total:
          type: integer
      required:
        - items
        - total
    LostReportPatchBody:
      type: object
      properties:
        categoryId:
          type: integer
          minimum: 1
          maximum: 32767
        color:
          $ref: "#/components/schemas/ItemColor"
        brand:
          type:
            - string
            - "null"
          minLength: 1
        lostPlace:
          type: string
          minLength: 1
        lostAt:
          type: string
          format: date-time
        note:
          type:
            - string
            - "null"
          minLength: 1
    MessageList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required:
        - items
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderRole:
          $ref: "#/components/schemas/SenderRole"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - senderRole
        - body
        - createdAt
    SenderRole:
      type: string
      enum:
        - admin
        - guest
    MessageCreate:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - body
    ChatThreadList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatThread"
        total:
          type: integer
      required:
        - items
        - total
    ChatThread:
      type: object
      properties:
        lostReportId:
          type: string
          format: uuid
        displayNumber:
          type: string
          example: 申-00118
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          required:
            - id
            - name
        color:
          $ref: "#/components/schemas/ItemColor"
        status:
          $ref: "#/components/schemas/LostStatus"
        lastMessageAt:
          type: string
          format: date-time
        awaitingReply:
          type: boolean
      required:
        - lostReportId
        - displayNumber
        - category
        - color
        - status
        - lastMessageAt
        - awaitingReply
    MessageBroadcastResult:
      type: object
      properties:
        sent:
          type: integer
      required:
        - sent
    MessageBroadcast:
      type: object
      properties:
        lostReportIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 1000
          description: 宛先の申請の ID（status と一緒には使えない）
        status:
          allOf:
            - $ref: "#/components/schemas/LostStatus"
            - description: このステータスの申請すべてに送る（lostReportIds と一緒には使えない）
        body:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - body
    MatchCreateBody:
      type: object
      properties:
        foundItemId:
          type: string
          format: uuid
      required:
        - foundItemId
  parameters: {}
paths:
  /api/health:
    get:
      summary: アプリと DB の疎通確認
      responses:
        "200":
          description: アプリと DB がつながっている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOk"
        "503":
          description: DB につながらない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
  /api/categories:
    get:
      summary: カテゴリ 12 種と貴重品の初期値
      responses:
        "200":
          description: カテゴリの一覧（並び順どおり）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/me:
    get:
      summary: ログイン中の人のロール・メール・同意済みか
      responses:
        "200":
          description: ログイン中の人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: ログインしていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/me/consent:
    post:
      summary: 個人情報の取り扱いに同意する（guest）
      description: ログインしている guest の guests の行を作る（あれば agreedAt を入れる）。本文は受け取らない。2 回目以降も
        200 で、最初に同意した日時を残す。Supabase Auth のユーザーが消されていれば 401
      responses:
        "200":
          description: 同意したあとのログイン中の人（GET /api/me と同じ形）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: ログインしていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 権限がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/found-items:
    get:
      summary: 拾得物の一覧・検索（member / admin）
      description: foundAt の新しい順。削除したものは出さない。一覧では photos は 1 枚目だけ
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
            description: ブランド・メモ・場所の部分一致
          required: false
          description: ブランド・メモ・場所の部分一致
          name: q
          in: query
        - schema:
            type: string
            description: カンマ区切りで複数（received / matching / awaiting_handover / resolved /
              transferred_to_police / disposed）
            example: received,matching
          required: false
          description: カンマ区切りで複数（received / matching / awaiting_handover / resolved /
            transferred_to_police / disposed）
          name: status
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 32767
          required: false
          name: categoryId
          in: query
        - schema:
            type: string
            description: カンマ区切りで複数（black / white / gray / brown / beige / red / pink /
              orange / yellow / green / blue / navy / purple / gold / silver /
              clear / other）。紺と青のように呼び方が揺れる色をまとめて探す
            example: navy,blue
          required: false
          description: カンマ区切りで複数（black / white / gray / brown / beige / red / pink /
            orange / yellow / green / blue / navy / purple / gold / silver /
            clear / other）。紺と青のように呼び方が揺れる色をまとめて探す
          name: color
          in: query
        - schema:
            type: string
            description: 拾った場所の部分一致
          required: false
          description: 拾った場所の部分一致
          name: place
          in: query
        - schema:
            type: string
            format: date-time
            description: この日時以降に拾ったもの
          required: false
          description: この日時以降に拾ったもの
          name: foundFrom
          in: query
        - schema:
            type: string
            format: date-time
            description: この日時以前に拾ったもの
          required: false
          description: この日時以前に拾ったもの
          name: foundTo
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            description: true なら自分の登録だけ
          required: false
          description: true なら自分の登録だけ
          name: mine
          in: query
      responses:
        "200":
          description: 拾得物の一覧と、条件に合う全件の数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundItemList"
        "400":
          description: 入力が正しくない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: ログインしていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 権限がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: 拾得物の登録（member / admin）
      description: 拾得物を 1 件登録する。photos は原則必須だが、「証明書・カード・定期券類」のみ空配列可
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoundItemCreateBody"
      responses:
        "201":
          description: 登録した拾得物
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundItem"
        "400":
          description: 入力が正しくない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: ログインしていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 権限がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: カテゴリが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/found-items/{id}:
    get:
      summary: 拾得物の詳細（member / admin）
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: 拾得物の詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundItem"
        "400":
          description: 入力が正しくない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: ログインしていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 権限がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 見つからない（削除済みを含む）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: 拾得物の編集（member は自分の登録だけ / admin）
      description: photos を送ったら丸ごと置き換える。ステータス変更はしない
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryId:
                  type: integer
                  minimum: 1
                  maximum: 32767
                color:
                  $ref: "#/components/schemas/ItemColor"
                brand:
                  type:
                    - string
                    - "null"
                  minLength: 1
                foundPlace:
                  type: string
                  minLength: 1
                foundAt:
                  type: string
                  format: date-time
                isValuable:
                  type: boolean
                memo:
                  type:
                    - string
                    - "null"
                  minLength: 1
                photos:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                        minLength: 1
                      thumbPath:
                        type: string
                        minLength: 1
                    required:
                      - path
                      - thumbPath
                  maxItems: 10
      responses:
        "200":
          description: 更新後の拾得物
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundItem"
        "400":
          description: 入力が正しくない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: ログインしていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 権限がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 見つからない（削除済みを含む）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: 拾得物の論理削除（member は自分の登録だけ / admin）
      description: status が received のときだけ削除できる
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "204":
          description: 削除完了（ボディなし）
        "400":
          description: 入力が正しくない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: ログインしていない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 権限がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 見つからない（削除済みを含む）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 現在のステータスでは操作できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーのエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/lost-reports/{id}:
    get:
      summary: 遺失物申請の詳細・申請状況（guest は自分の申請だけ / admin）
      description: 他人の申請は 404。admin にだけ guest・activeMatch・awaitingReply を返す
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: 遺失物申請の詳細（admin の場合は LostReportForAdmin）
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/LostReport"
                  - $ref: "#/components/schemas/LostReportForAdmin"
        "400":
          description: 入力が正しくない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: ログインしていない
          content:
            application/json:
              schema:
